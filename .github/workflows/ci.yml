name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev iproute2 python3

      - name: Parser tests (ASan + UBSan)
        run: make check

      - name: Build loader and BPF object
        run: make all

      - name: End-to-end (veth + netns, real kernel verifier)
        run: sudo make smoke
